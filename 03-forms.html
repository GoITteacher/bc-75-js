<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Form events</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <p><a href="index.html">Go back</a></p>

    <form class="js-form feedback-form">
      <input
        type="text"
        name="title"
        class="form-input"
        placeholder="Title"
        required
      />

      <input
        type="number"
        name="price"
        class="form-input"
        placeholder="price"
        required
      />

      <input
        type="number"
        name="amount"
        class="form-input"
        placeholder="amount"
        required
      />

      <input
        type="date"
        name="date"
        class="form-input"
        placeholder="date"
        required
      />

      <button class="form-button" name="myBtn">Submit</button>
    </form>

    <ul class="js-product-list"></ul>
    <script src="./js/03-forms.js"></script>
  </body>
</html>
